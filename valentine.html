<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidden</title>
    <style>
        body {
            background-color: pink;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        h1 {
            margin-top: 50px;
            font-size: 30px;
            color: red;
        }
        .button-container {
            margin-top: 30px;
            position: relative;
        }
        button {
            font-size: 30px;
            padding: 20px 40px;
            margin: 10px;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            position: relative;
        }
        #yesButton {
            background-color: green;
            color: white;
        }
        #noButton {
            background-color: red;
            color: white;
            position: absolute;
        }
    </style>
</head>
<body>
    <h1>Will you be my Valentine? 💖</h1>
    <div class="button-container">
        <button id="yesButton" onclick="redirectToBear()">Yes</button>
        <button id="noButton" onclick="resizeButtons()">No</button>
    </div>

    <script>
        let clickCount = 0;

        function resizeButtons() {
            clickCount++;
            let yesBtn = document.getElementById("yesButton");
            let noBtn = document.getElementById("noButton");

            yesBtn.style.fontSize = (50 + clickCount * 10) + "px";
            yesBtn.style.padding = (40 + clickCount * 5) + "px";

            noBtn.style.fontSize = (30 - clickCount * 2) + "px";
            noBtn.style.padding = (20 - clickCount) + "px";

            if (clickCount >= 5) {
                let randomX = Math.random() * 300 - 150;
                let randomY = Math.random() * 300 - 150;
                noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
            }

            if (clickCount >= 10) {
                noBtn.innerText = "Yes";
                noBtn.onclick = redirectToBear;
            }
        }

        function redirectToBear() {
            window.location.href = "dancingbear.html";
        }
    </script>
</body>
</html>
